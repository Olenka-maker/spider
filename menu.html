<header>

        <div class="logo">PlayStation Store</div>
        <nav>

                    <div class="game-row red"><span>людина павук</span><span class="dots"></span><span>4500 грн</span></div>
                </div>

                <div class="game-item-row">
                    <img src="./download 9.png" class="game-icon">
                    <div class="game-row blue"><span>Uncharted 4</span><span class="dots"></span><span>6500 грн</span></div>

                <div class="game-item-row">
                    <img src="./download 6.png" class="game-icon">

                <div class="game-item-row">
                    <img src="./download 8.png" class="game-icon">
                    <div class="game-row dark-red"><span>людина павук 2</span><span class="dots"></span><span>8000 грн</span></div>
                </div>

                <div class="game-item-row">
                    <img src="./download 11.png" class="game-icon">
                    <div class="game-row grey"><span>Horizon</span><span class="dots"></span><span>6500 грн</span></div>
                </div>

            </div>
        </div>

        <div class="game-category">
            <h3>багатокористувальні</h3>
            <div class="game-grid-layout">

                <div class="game-item-row">
                    <img src="download 12.png" class="game-icon">
                    <div class="game-row pink"><span>Fall guys</span><span class="dots"></span><span>0 грн</span></div>
                </div>

                <div class="game-item-row">
                    <img src="download 13.png" class="game-icon">
                    <div class="game-row purple"><span>Fortnite</span><span class="dots"></span><span>0 грн</span></div>
                </div>
